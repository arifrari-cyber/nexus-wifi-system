<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nexus WiFi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <nav class="glass sticky top-0 z-50 rounded-none border-t-0 border-x-0 p-4">
        <div class="container mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-sky-600 bg-clip-text text-transparent">NEXUS WIFI</h1>
            <div class="flex items-center gap-4">
                <button id="logoutBtn" class="p-2 text-red-400 hover:bg-red-400/10 rounded-xl transition-all">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8 space-y-8 animate-fade">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
                <h2 class="text-3xl font-bold" id="userName">Welcome, User</h2>
                <p class="text-slate-400">Your WiFi connection summary</p>
            </div>
            <div id="accountStatus" class="px-4 py-2 rounded-full text-sm font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20">
                Status: FREE
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass p-8 space-y-6">
                <div class="flex items-center gap-3 text-sky-400">
                    <i data-lucide="wifi"></i>
                    <h3 class="text-lg font-bold">Connection Credentials</h3>
                </div>

                <div id="credentialsArea" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Loaded via JS -->
                </div>
            </div>

            <div class="glass p-8 space-y-6">
                <div class="flex items-center gap-3 text-emerald-400">
                    <i data-lucide="calendar"></i>
                    <h3 class="text-lg font-bold">Subscription</h3>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl">
                        <span class="text-slate-400 text-sm">Expiration</span>
                        <span class="font-bold" id="expirationDate">N/A</span>
                    </div>
                    <a href="subscription.html" class="block w-full text-center py-3 btn-primary">Manage Plans</a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
