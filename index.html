<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexus WiFi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass w-full max-w-md p-8 md:p-10 animate-fade">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-sky-400 to-sky-600 bg-clip-text text-transparent">NEXUS WIFI</h1>
            <p class="text-slate-400 mt-2">Sign in to manage your connection</p>
        </div>

        <!-- Login Section (Step 1) -->
        <div id="loginSection">
            <form id="loginForm" class="space-y-6">
                <div class="input-group">
                    <label>Email or Mobile</label>
                    <div class="relative">
                        <input type="text" id="identifier" placeholder="Enter your email or mobile" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Next Step
                </button>
            </form>
            <div class="text-center mt-4">
                <button onclick="handleForgotPassword()" class="text-sky-400 text-xs hover:underline">Forgot Password?</button>
            </div>
        </div>

        <!-- OTP Section (Step 2) -->
        <div id="otpSection" class="hidden animate-fade">
            <div class="text-center mb-6">
                <p class="text-sm text-slate-400">A 6-digit code has been sent to <br><b id="displayEmail" class="text-white"></b></p>
            </div>
            <form id="verifyOtpForm" class="space-y-6">
                <div class="input-group">
                    <label>Enter Verification Code</label>
                    <input type="text" id="loginOtp" maxlength="6" placeholder="123456" class="text-center text-2xl tracking-[1em]" required>
                </div>
                <button type="submit" class="btn-primary w-full">Verify & Sign In</button>
                <button type="button" onclick="location.reload()" class="w-full text-slate-500 text-xs hover:text-white">Back to Login</button>
            </form>
        </div>

        <div class="text-center mt-8 text-slate-400 text-sm">
            Don't have an account? <a href="register.html" class="text-sky-400 font-bold hover:underline">Register Now</a>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
