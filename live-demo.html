<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus WiFi - Live Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49',
                        },
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .premium-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }
        .dark .premium-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Wifi, Calendar, User, Copy, CheckCircle, Clock, Sun, Moon, LogOut, LayoutDashboard, ShieldCheck, Zap, Crown, ArrowRight, CreditCard, X } = lucide;

        const App = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [view, setView] = useState('dashboard'); // dashboard, subscription, admin
            const [isPaid, setIsPaid] = useState(false);
            const [showPayment, setShowPayment] = useState(false);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const Navbar = () => (
                <nav className="glass sticky top-0 z-50 border-b border-white/20 dark:border-white/10">
                    <div className="container mx-auto px-4 h-16 flex items-center justify-between">
                        <div className="text-2xl font-bold bg-gradient-to-r from-primary-500 to-primary-700 bg-clip-text text-transparent cursor-pointer" onClick={() => setView('dashboard')}>
                            NEXUS WIFI
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                                {darkMode ? <Sun size={20} className="text-amber-400" /> : <Moon size={20} className="text-slate-600" />}
                            </button>
                            <button onClick={() => setView('dashboard')} className={`p-2 rounded-xl transition-colors ${view === 'dashboard' ? 'bg-primary-500/10 text-primary-500' : 'text-slate-600 dark:text-slate-300'}`}>
                                <LayoutDashboard size={20} />
                            </button>
                            <button onClick={() => setView('subscription')} className={`p-2 rounded-xl transition-colors ${view === 'subscription' ? 'bg-primary-500/10 text-primary-500' : 'text-slate-600 dark:text-slate-300'}`}>
                                <Zap size={20} />
                            </button>
                            <button onClick={() => setView('admin')} className={`p-2 rounded-xl transition-colors ${view === 'admin' ? 'bg-primary-500/10 text-primary-500' : 'text-slate-600 dark:text-slate-300'}`}>
                                <ShieldCheck size={20} />
                            </button>
                            <button className="p-2 rounded-xl hover:bg-red-500/10 text-red-500 transition-colors">
                                <LogOut size={20} />
                            </button>
                        </div>
                    </div>
                </nav>
            );

            const Dashboard = () => (
                <div className="space-y-8 animate-in fade-in duration-500">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 dark:text-white">Welcome back, Arif Islam</h1>
                            <p className="text-slate-500 dark:text-slate-400">Manage your WiFi subscription and connection.</p>
                        </div>
                        <div className={`px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 ${
                            isPaid ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-500 border border-amber-500/20'
                        }`}>
                            {isPaid ? <CheckCircle size={16} /> : <Clock size={16} />}
                            Account Status: {isPaid ? 'PAID' : 'FREE'}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 glass rounded-3xl p-8 space-y-6 premium-shadow">
                            <div className="flex items-center gap-3 text-primary-500 font-semibold text-lg">
                                <Wifi size={24} />
                                <h2>Connection Credentials</h2>
                            </div>
                            {!isPaid ? (
                                <div className="flex flex-col items-center justify-center py-10 text-center space-y-4">
                                    <div className="p-4 bg-primary-500/10 rounded-full text-primary-500"><Wifi size={40} className="animate-pulse" /></div>
                                    <h3 className="text-xl font-bold text-slate-800 dark:text-white">Activate your Connection</h3>
                                    <p className="text-slate-500 dark:text-slate-400 max-w-sm">Your account is currently FREE. Subscribe to a plan to get your PPPoE credentials.</p>
                                    <button onClick={() => setView('subscription')} className="px-6 py-3 bg-primary-600 text-white rounded-2xl font-bold hover:bg-primary-700 shadow-xl shadow-primary-600/20">View Plans</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold uppercase tracking-wider text-slate-400">PPPoE Username</label>
                                        <div className="flex items-center justify-between p-4 bg-slate-100 dark:bg-white/5 rounded-2xl group border border-transparent hover:border-primary-500/30 transition-all">
                                            <span className="font-mono text-slate-800 dark:text-slate-200">nexus_arif_521</span>
                                            <button className="p-2 opacity-0 group-hover:opacity-100 text-primary-500"><Copy size={16} /></button>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold uppercase tracking-wider text-slate-400">PPPoE Password</label>
                                        <div className="flex items-center justify-between p-4 bg-slate-100 dark:bg-white/5 rounded-2xl group border border-transparent hover:border-primary-500/30 transition-all">
                                            <span className="font-mono text-slate-800 dark:text-slate-200">k8a2m9s7</span>
                                            <button className="p-2 opacity-0 group-hover:opacity-100 text-primary-500"><Copy size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="glass rounded-3xl p-8 space-y-6 premium-shadow">
                            <div className="flex items-center gap-3 text-emerald-500 font-semibold text-lg"><Calendar size={24} /><h2>Subscription</h2></div>
                            <div className="space-y-4">
                                <div className="flex items-center justify-between p-4 bg-slate-100 dark:bg-white/5 rounded-2xl">
                                    <div className="flex items-center gap-3"><Clock className="text-slate-400" size={20} /><span className="text-slate-600 dark:text-slate-300">Expires on</span></div>
                                    <span className="font-bold text-slate-800 dark:text-white">{isPaid ? '05/06/2026' : 'N/A'}</span>
                                </div>
                                <div className="p-6 bg-gradient-to-br from-primary-600 to-primary-800 rounded-2xl text-white space-y-2">
                                    <p className="text-primary-100 text-sm">Need more speed?</p>
                                    <h3 className="text-xl font-bold">Upgrade your plan</h3>
                                    <button onClick={() => setView('subscription')} className="block w-full text-center mt-4 py-3 bg-white text-primary-600 rounded-xl font-bold hover:bg-slate-100 transition-colors">View Packages</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const Subscription = () => (
                <div className="space-y-12 max-w-6xl mx-auto animate-in fade-in duration-500">
                    <div className="text-center space-y-4">
                        <h1 className="text-4xl font-bold text-slate-800 dark:text-white">Choose Your Plan</h1>
                        <p className="text-slate-500 dark:text-slate-400 max-w-lg mx-auto">Get the best internet experience with our premium WiFi packages.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {[
                            { name: 'FREE', speed: '5 Mbps', price: 0, icon: <Shield size={24}/> },
                            { name: 'SILVER', speed: '10 Mbps', price: 500, recommended: true, icon: <Zap size={24}/> },
                            { name: 'GOLD', speed: '20 Mbps', price: 1000, icon: <Crown size={24}/> }
                        ].map((pkg, idx) => (
                            <div key={idx} className={`relative glass rounded-[2.5rem] p-8 flex flex-col premium-shadow transition-all border-2 ${pkg.recommended ? 'border-primary-500 scale-105 z-10' : 'border-transparent'}`}>
                                {pkg.recommended && <span className="absolute -top-4 left-1/2 -translate-x-1/2 bg-primary-500 text-white px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest">Recommended</span>}
                                <div className="flex items-center justify-between mb-8">
                                    <div className="p-3 rounded-2xl bg-primary-500/20 text-primary-500">{pkg.icon}</div>
                                    <span className="text-slate-400 font-medium">{pkg.speed}</span>
                                </div>
                                <h3 className="text-2xl font-bold text-slate-800 dark:text-white mb-2">{pkg.name}</h3>
                                <div className="flex items-baseline gap-1 mb-8">
                                    <span className="text-4xl font-bold text-slate-800 dark:text-white">৳{pkg.price}</span>
                                    <span className="text-slate-400">/month</span>
                                </div>
                                <button onClick={() => setShowPayment(true)} className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-2 ${pkg.recommended ? 'bg-primary-600 text-white shadow-xl shadow-primary-600/30' : 'bg-slate-200 dark:bg-white/5 text-slate-800 dark:text-white'}`}>
                                    Get Started <ArrowRight size={18} />
                                </button>
                            </div>
                        ))}
                    </div>
                    {showPayment && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="relative glass dark:bg-slate-900 rounded-[2.5rem] p-8 w-full max-w-md shadow-2xl">
                                <button onClick={() => setShowPayment(false)} className="absolute top-6 right-6 p-2 text-slate-400"><X size={20} /></button>
                                <div className="text-center space-y-6">
                                    <div className="w-16 h-16 bg-primary-500/20 text-primary-500 rounded-2xl flex items-center justify-center mx-auto"><CreditCard size={32} /></div>
                                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white">Complete Payment</h2>
                                    <div className="bg-slate-100 dark:bg-white/5 p-6 rounded-3xl space-y-4 text-left">
                                        <div className="flex justify-between text-sm"><span className="text-slate-400">Merchant Number:</span><span className="font-bold text-slate-800 dark:text-white">01700000000</span></div>
                                        <div className="flex justify-between text-sm"><span className="text-slate-400">Reference ID:</span><span className="font-bold text-slate-800 dark:text-white font-mono uppercase">TXN_521A</span></div>
                                    </div>
                                    <div className="space-y-4">
                                        <input type="text" placeholder="Enter TrxID (e.g. BK7A9B...)" className="w-full px-6 py-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-transparent focus:border-primary-500 outline-none text-white font-mono" />
                                        <button onClick={() => { setIsPaid(true); setShowPayment(false); setView('dashboard'); }} className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-xl shadow-emerald-600/20">Verify Payment</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen">
                    <Navbar />
                    <main className="container mx-auto px-4 py-8">
                        {view === 'dashboard' ? <Dashboard /> : <Subscription />}
                        {view === 'admin' && (
                            <div className="text-center py-20 glass rounded-3xl">
                                <ShieldCheck size={64} className="mx-auto text-primary-500 mb-4" />
                                <h2 className="text-2xl font-bold text-white">Admin Panel</h2>
                                <p className="text-slate-400">Advanced user management system is ready.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
