<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Nexus WiFi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>

<body class="flex items-center justify-center p-4">
    <div class="glass w-full max-w-md p-8 md:p-10 animate-fade">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-sky-400 to-sky-600 bg-clip-text text-transparent">NEXUS WIFI</h1>
            <p class="text-slate-400 mt-2">Reset your account password</p>
        </div>

        <form id="resetPasswordForm" class="space-y-6">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
                <i data-lucide="key" class="w-5 h-5"></i>
                Update Password
            </button>
        </form>

        <div class="text-center mt-8">
            <a href="index.html" class="text-sky-400 text-sm hover:underline">Back to Login</a>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            
            const form = document.getElementById('resetPasswordForm');
            if (form) {
                form.addEventListener('submit', handleResetPasswordSubmit);
            }
        });
    </script>
</body>

</html>
